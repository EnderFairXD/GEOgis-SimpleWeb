name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests con PostGIS
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: GeoDjango
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DJANGO_SECRET_KEY: solo-para-ci
      # Los tests funcionales van en modo desarrollo (sin redirección a HTTPS), como en
      # local. Los de producción (test_produccion) cargan su propio entorno de producción.
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Librerías de GeoDjango (GDAL, GEOS, PROJ)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - run: pip install -r requirements.txt
      - name: Comprobar que no faltan migraciones
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker:
    name: Arranque con Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Levantar la app
        run: docker compose up -d --build
      - name: Esperar a que responda
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 2
          done
      - name: Importar las estaciones del MITECO y comprobar la API
        run: |
          docker compose exec -T web python manage.py importar_estaciones
          curl -sf http://localhost:8000/api/estaciones/ \
            | python3 -c "import sys, json; n = len(json.load(sys.stdin)['features']); print(n, 'estaciones activas'); sys.exit(n < 500)"
      - name: Importar los municipios de GISCO y comprobar la cobertura
        run: |
          docker compose exec -T web python manage.py importar_municipios
          curl -sf "http://localhost:8000/api/cobertura/?km=25" \
            | python3 -c "import sys, json; d = json.load(sys.stdin); print(d['municipios']['total'], 'municipios,', d['poblacion']['porcentaje'], '% cubierto'); sys.exit(d['municipios']['total'] < 8000)"
      - name: Tests dentro del contenedor
        run: docker compose exec -T web python manage.py test
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs
      - name: Parar
        if: always()
        run: docker compose down -v

  produccion:
    name: Imagen de producción (prueba de humo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Arrancar docker-compose.prod.yml con secretos de prueba
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
            echo "DJANGO_ALLOWED_HOSTS=geogis.localtest"
            echo "DJANGO_CSRF_TRUSTED_ORIGINS=https://geogis.localtest"
            echo "DB_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          } > .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

      - name: Comprobar que se comporta como producción
        run: |
          U=http://127.0.0.1:8000; H='Host: geogis.localtest'; P='X-Forwarded-Proto: https'
          for i in $(seq 60); do curl -s -o /dev/null -H "$H" -H "$P" $U/ && break; sleep 2; done
          codigo() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          comprobar() { echo "$1: $2 (esperado $3)"; [ "$2" = "$3" ]; }
          comprobar "HTTP redirige a HTTPS" "$(codigo -H "$H" $U/)" 301
          comprobar "Portada" "$(codigo -H "$H" -H "$P" $U/)" 200
          comprobar "Estático de Leaflet" "$(codigo -H "$H" -H "$P" $U/static/leaflet/leaflet.css)" 200
          comprobar "Dominio no permitido" "$(codigo -H 'Host: otro.example' -H "$P" $U/)" 400
          comprobar "Página inexistente" "$(codigo -H "$H" -H "$P" $U/no-existe)" 404
          curl -sI -H "$H" -H "$P" $U/ | grep -qi '^strict-transport-security' && echo "HSTS: sí"
          ! curl -s -H "$H" -H "$P" $U/no-existe | grep -qiE 'DEBUG = True|Traceback' && echo "Sin páginas de depuración"

      - name: Registros si algo falla
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs

      - name: Parar
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down -v

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: GeoDjango
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d GeoDjango"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Desarrollo: servidor de Django con recarga automática. La imagen arranca
    # gunicorn por defecto (producción, ver docker-compose.prod.yml).
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    # Como root, como antes, para poder escribir en el código montado (p. ej. makemigrations).
    user: root
    ports:
      - "8000:8000"
    environment:
      # Definidas aquí para que un .env local (montado con el código) no las sustituya
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: GeoDjango
      DB_USER: postgres
      DB_PASSWORD: postgres
      DJANGO_SECRET_KEY: solo-para-desarrollo-local
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app  # los cambios en el código se ven sin reconstruir la imagen
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
